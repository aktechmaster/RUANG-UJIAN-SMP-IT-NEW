<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian CBT - SMP IT Al-Kautsar</title>
    <link rel="icon" href="smpit.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
    /* CSS RESET & VARIABLES */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        /* Background modern dengan gradasi pastel yang lembut */
        background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #ede9fe 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        padding: 24px;
    }

    /* GLASSMORPHISM CONTAINER (Disesuaikan untuk Background Terang) */
    .login-container {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 28px;
        padding: 42px 36px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        text-align: center;
        z-index: 1;
        transition: all 0.3s ease;
    }

    .login-container:hover {
        box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.1);
        border-color: rgba(56, 189, 248, 0.3);
    }

    /* LOGO & TYPOGRAPHY */
    .logo {
        width: 90px;
        height: auto;
        margin-bottom: 16px;
        filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.08));
        transition: transform 0.3s ease;
    }

    .logo:hover {
        transform: scale(1.05);
    }

    h1 {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 32px;
        line-height: 1.5;
        color: #0f172a; 
        letter-spacing: -0.01em;
    }

    /* FORM ELEMENTS */
    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }

    label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 8px;
        color: #475569; 
        font-weight: 600;
        letter-spacing: 0.01em;
    }

    /* Styles seragam untuk Select, Input Password, dan Input Email */
    select, input[type="password"], input[type="email"], input[type="text"] {
        width: 100%;
        padding: 13px 18px;
        background: #ffffff; 
        border: 1.5px solid #cbd5e1;
        border-radius: 14px;
        color: #1e293b; 
        font-size: 0.95rem;
        outline: none;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    /* Khusus Dropdown (panah custom warna gelap) */
    select {
        appearance: none; 
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 18px center;
        background-size: 16px;
        cursor: pointer;
    }

    select option {
        background: #ffffff;
        color: #1e293b;
    }

    select:disabled {
        background: #f8fafc;
        color: #94a3b8;
        cursor: not-allowed;
        border-color: #e2e8f0;
    }

    /* Placeholder untuk Input */
    input[type="password"]::placeholder, input[type="email"]::placeholder, input[type="text"]::placeholder {
        color: #94a3b8;
        font-weight: 300;
    }

    /* Efek Fokus */
    select:focus, input[type="password"]:focus, input[type="email"]:focus, input[type="text"]:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
        background: #ffffff;
    }

    /* BUTTON */
    .btn-submit {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-top: 12px;
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(56, 189, 248, 0.4);
        filter: brightness(1.05);
    }

    .btn-submit:active {
        transform: translateY(1px);
    }

    .btn-submit:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
        filter: none;
        opacity: 0.7;
    }

    /* TAMBAHAN: TOMBOL PILIHAN (BUTTON OPSI) */
    .btn-opsi {
        padding: 10px 14px;
        background-color: #f8fafc;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.85rem;
        font-family: inherit;
        font-weight: 500;
        color: #334155;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-opsi:hover {
        background-color: #f1f5f9;
        border-color: #94a3b8;
        color: #0f172a;
    }

    .btn-opsi.selected {
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        color: #ffffff;
        border: none;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    /* FOOTER */
    .footer-credit {
        margin-top: 32px;
        font-size: 0.78rem;
        color: #64748b; 
        line-height: 1.6;
    }
    
    .footer-credit span {
        font-weight: 600;
        color: #0284c7; 
    }

    /* LOADER */
    .loader {
        display: none;
        font-size: 0.78rem;
        color: #0284c7;
        margin-top: 8px;
        font-weight: 500;
    }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="smpit.png" alt="Logo SMP IT Al-Kautsar" class="logo" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
        
        <h1>Selamat Datang di Ruang Ujian<br>SMP IT Al-Kautsar Mukomuko</h1>

        <form id="loginForm">
            <div class="input-group">
                <label for="pilihKelas">Pilih Kelas</label>
                <div id="kelasContainer" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;"></div>
                <input type="hidden" id="pilihKelas" required>
            </div>

            <div class="input-group">
                <label for="pilihSiswa">Nama Siswa</label>
                <input type="text" id="pilihSiswa" placeholder="KETIK NAMA LENGKAP SISWA..." autocomplete="off" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z\s]/g, '')" required>
                <div id="loadingSiswa" class="loader" style="display: none;">Memuat data siswa dari server...</div>
            </div>

            <div class="input-group">
                <label for="pilihMapel">Pilih Mata Pelajaran</label>
                <div id="mapelContainer" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;"></div>
                <input type="hidden" id="pilihMapel" required>
            </div>

            <div class="input-group">
                <label for="emailSiswa">Email Anda</label>
                <input type="email" id="emailSiswa" placeholder="contoh: siswa@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="tokenUjian">Token / Password Ujian</label>
                <input type="password" id="tokenUjian" placeholder="Masukkan token mapel..." required>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit" disabled>Memuat Sistem...</button>
        </form>

        <div class="footer-credit">
            &copy; 2026 <span>aktechmaster</span> <br>
            Designed & Developed by aktechmaster
        </div>
    </div>

    <script>
        // Mendapatkan elemen input atau container yang dibutuhkan
        const kelasSelect = document.getElementById('pilihKelas'); // Input hidden kelas
        const siswaSelect = document.getElementById('pilihSiswa'); // Input teks siswa
        const mapelSelect = document.getElementById('pilihMapel'); // Input hidden mapel
        const loadingText = document.getElementById('loadingSiswa');
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('btnSubmit');

        const kelasContainer = document.getElementById('kelasContainer');
        const mapelContainer = document.getElementById('mapelContainer');

        // =========================================================
        // LINK URL WEB APP GOOGLE SCRIPT ANDA
        // =========================================================
        const SPREADSHEET_API_URL = "https://script.google.com/macros/s/AKfycbxF3g7LSwr61mNuVqOApDXnmjZsY5putWlumzL_GnJJN8hOPqhTk0MR9aPRnmbFJX1x/exec";

        // ========================================================
        // 1. KETIKA HALAMAN DIBUKA (AMBIL DATA KELAS & MAPEL)
        // ========================================================
        document.addEventListener("DOMContentLoaded", async function() {
            try {
                // Memanggil API Google Apps Script
                const response = await fetch(`${SPREADSHEET_API_URL}?action=getInitialData`);
                const data = await response.json();

                // Memasukkan data Kelas ke dalam container sebagai tombol
                kelasContainer.innerHTML = '';
                if (data.kelas && data.kelas.length > 0) {
                    data.kelas.forEach(kelas => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn-opsi';
                        btn.textContent = kelas;
                        
                        // Event tombol kelas ketika diklik
                        btn.onclick = function() {
                            document.querySelectorAll('#kelasContainer .btn-opsi').forEach(b => b.classList.remove('selected'));
                            this.classList.add('selected');
                            
                            kelasSelect.value = kelas;
                            sessionStorage.setItem('cbt_kelas', kelas);
                            
                            // Muat siswa secara otomatis setelah kelas dipilih
                            muatDaftarSiswa(kelas);
                        };
                        kelasContainer.appendChild(btn);
                    });
                }

                // Memasukkan data Mapel ke dalam container sebagai tombol
                mapelContainer.innerHTML = '';
                if (data.mapel && data.mapel.length > 0) {
                    data.mapel.forEach(mapel => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn-opsi';
                        btn.textContent = mapel;

                        // Event tombol mapel ketika diklik
                        btn.onclick = function() {
                            document.querySelectorAll('#mapelContainer .btn-opsi').forEach(b => b.classList.remove('selected'));
                            this.classList.add('selected');
                            
                            mapelSelect.value = mapel;
                            sessionStorage.setItem('cbt_mapel', mapel);
                        };
                        mapelContainer.appendChild(btn);
                    });
                }

                // Mengaktifkan kembali tombol Lanjutkan
                submitBtn.textContent = "Lanjutkan Ujian";
                submitBtn.disabled = false;

            } catch (error) {
                console.error("Gagal mengambil data awal:", error);
                kelasContainer.innerHTML = '<span style="color:red; font-size:0.85rem;">Gagal memuat data kelas</span>';
                mapelContainer.innerHTML = '<span style="color:red; font-size:0.85rem;">Gagal memuat data mapel</span>';
                submitBtn.textContent = "Error Jaringan";
            }
        });

        // ========================================================
        // 2. FUNGSI KETIKA KELAS DIPILIH (AMBIL NAMA SISWA)
        // ========================================================
        async function muatDaftarSiswa(selectedKelas) {
            // Tampilkan animasi loading pada input teks siswa
            siswaSelect.value = '';
            siswaSelect.placeholder = "Memuat data siswa dari server...";
            siswaSelect.disabled = true;
            loadingText.style.display = 'block';

            try {
                // Memanggil API Google Apps Script untuk mengambil data siswa
                const response = await fetch(`${SPREADSHEET_API_URL}?action=getSiswa&kelas=${encodeURIComponent(selectedKelas)}`);
                const data = await response.json();
                const daftarSiswa = data.siswa;

                // Memasukkan data siswa ke datalist agar mudah diketik atau dipilih oleh siswa
                if (daftarSiswa && daftarSiswa.length > 0) {
                    let datalist = document.getElementById('listSiswa');
                    if (!datalist) {
                        datalist = document.createElement('datalist');
                        datalist.id = 'listSiswa';
                        document.body.appendChild(datalist);
                        siswaSelect.setAttribute('list', 'listSiswa');
                    }
                    datalist.innerHTML = '';
                    daftarSiswa.forEach(siswa => {
                        const option = document.createElement('option');
                        option.value = siswa;
                        datalist.appendChild(option);
                    });

                    siswaSelect.placeholder = "Ketik nama lengkap siswa...";
                    siswaSelect.disabled = false;
                } else {
                    siswaSelect.placeholder = "Data siswa kosong / tidak ditemukan";
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                siswaSelect.placeholder = "Gagal memuat data. Cek koneksi internet.";
            } finally {
                loadingText.style.display = 'none';
            }
        }

        // ========================================================
        // 3. LOGIKA TOMBOL SUBMIT & PENGECEKAN PASSWORD
        // ========================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            const kelas = kelasSelect.value;
            const siswa = siswaSelect.value;
            const mapel = mapelSelect.value;
            const enteredToken = document.getElementById('tokenUjian').value.trim(); 

            // Validasi apakah tombol kelas & mapel telah diklik
            if (!kelas || !mapel) {
                alert("Harap pilih Kelas dan Mata Pelajaran terlebih dahulu sebelum melanjutkan.");
                return;
            }

            // Ubah teks tombol saat memvalidasi ke server
            submitBtn.textContent = "Memeriksa Token...";
            submitBtn.disabled = true;

            try {
                // Memanggil API Google Apps Script untuk mencocokkan Token/Password
                const response = await fetch(`${SPREADSHEET_API_URL}?action=getToken&mapel=${encodeURIComponent(mapel)}`);
                const data = await response.json();
                const tokenBenar = data.password;

                if (tokenBenar) {
                    // Pengecekan tidak sensitif huruf besar/kecil
                    if (enteredToken.toLowerCase() !== tokenBenar.toString().toLowerCase()) {
                        alert(`MAAF!\nToken/Password yang Anda masukkan SALAH untuk mata pelajaran ${mapel}. \n\nSilakan cek kembali tulisan token Anda.`);
                        submitBtn.textContent = "Lanjutkan Ujian";
                        submitBtn.disabled = false;
                        return; // Batalkan proses masuk
                    }
                } else {
                    alert(`Sistem Error: Token untuk mapel ${mapel} belum diatur oleh admin di Spreadsheet.`);
                    submitBtn.textContent = "Lanjutkan Ujian";
                    submitBtn.disabled = false;
                    return;
                }

                // JIKA TOKEN BENAR, SIMPAN DATA DAN MASUK KE UJIAN
                const emailInput = document.getElementById('emailSiswa').value;
                
                sessionStorage.setItem('cbt_kelas', kelas);
                sessionStorage.setItem('cbt_siswa', siswa);
                sessionStorage.setItem('cbt_mapel', mapel);
                sessionStorage.setItem('cbt_email', emailInput); // Menyimpan data email ke session

                alert(`Login Berhasil!\n\nSelamat Mengerjakan:\nNama: ${siswa}\nKelas: ${kelas}\nMapel: ${mapel}\n\nBerdoalah sebelum memulai ujian!`);
                
                // Arahkan ke halaman ujian
                window.location.href = "ujian.html"; 

            } catch (error) {
                console.error("Error validasi token:", error);
                alert("Terjadi kesalahan saat memvalidasi token. Pastikan link URL sudah benar dan koneksi internet lancar.");
                submitBtn.textContent = "Lanjutkan Ujian";
                submitBtn.disabled = false;
            }
        });
    </script>

    <div id="exambroAlertModal" style="display: none; position: fixed; z-index: 999999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); justify-content: center; align-items: center;">
        <div style="background: #ffffff; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.3);">
            <h3 style="color: #0284c7; margin-bottom: 15px; font-weight: 600;">Notifikasi</h3>
            <p id="exambroAlertMessage" style="color: #475569; font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px; white-space: pre-line;"></p>
            <button onclick="tutupExambroAlert()" style="width: 100%; padding: 13px; background: linear-gradient(135deg, #38bdf8, #8b5cf6); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);">Mengerti</button>
        </div>
    </div>

    <script>
        window.alert = function(message) {
            document.getElementById('exambroAlertMessage').innerText = message;
            document.getElementById('exambroAlertModal').style.display = 'flex';
        };

        function tutupExambroAlert() {
            document.getElementById('exambroAlertModal').style.display = 'none';
        }
    </script>
</body>
</html>
