<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian CBT</title>
    <script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        * { box-sizing: border-box; }
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px; 
            max-width: 800px; 
            margin: auto; 
            background-color: #E0FFFF;
            background-image: url('floating-cogs.svg');
            background-size: 120px 120px;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
}
        
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; }
        hr { border: 0; border-top: 2px solid #ddd; margin-bottom: 20px; }

        .soal-box { 
            background: #fff; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }

        .bacaan {
            background: #fdfae3;
            padding: 15px;
            border-left: 4px solid #f1c40f;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .pertanyaan {
            font-weight: normal;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }

        .opsi-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .opsi label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            transition: background 0.2s;
        }
        .opsi label:hover { background: #f8f9fa; }
        .opsi input[type="radio"] {
            margin-top: 4px;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        button { 
            width: 100%;
            padding: 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            margin-bottom: 30px;
        }
        button:hover { background: #0056b3; }

        .header-ujian {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #38bdf8;
        }
        .header-ujian h2 {
            margin-bottom: 10px;
            color: #1e293b;
        }
        .info-siswa p {
            margin: 5px 0;
            font-size: 0.95rem;
            color: #475569;
        }

        /* TIMER MENGAMBANG */
        #floating-timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1e293b;
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* POPUP MODAL */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 10000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.5); 
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 30px;
            border: 1px solid #888;
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            color: #10b981;
            margin-bottom: 15px;
        }

        /* Load Font Arab (Pastikan file font tersedia atau gunakan alternatif Google Font) */
        @import url('https://fonts.googleapis.com/css2?family=Amiri&display=swap');

        /* === Aturan Dasar Semua Teks Biasa (Bahasa Indonesia) === */
body, .soal-box, .bacaan, .pertanyaan, .opsi, .info-siswa, h1, h2, p, span {
    direction: ltr !important;        /* Arah tulisan kiri ke kanan */
    text-align: left !important;       /* Posisi rata kiri */
    font-size: 16px;                   /* Ukuran normal */
    line-height: 1.6;
}

/* === Khusus Teks Bahasa Arab Saja === */
.teks-arab {
    font-family: 'Amiri', 'MohammadNaskh', serif;
    direction: rtl !important;         /* Arah tulisan kanan ke kiri */
    text-align: right !important;       /* Posisi rata kanan */
    font-size: 1.6rem;                 /* Tetap besar sesuai keinginan */
    line-height: 1.8;
    display: block;
}

/* Font cadangan Arab */
@font-face {
    font-family: 'MohammadNaskh';
    src: url('MohammadNaskh.ttf') format('truetype');
}

.font-khusus-arab {
    font-family: 'MohammadNaskh', 'Amiri', serif;
}
    </style>
    
</head>
    
<body>

    <div id="floating-timer">
        ⏳ <span id="timer-display">02:00:00</span>
    </div>

    <div class="header-ujian">
        <h2 id="judulMapel">Memuat Mata Pelajaran...</h2>
        <div class="info-siswa">
            <p><strong>Nama    :</strong> <span id="infoNama">-</span></p>
            <p><strong>Kelas   :</strong> <span id="infoKelas">-</span></p>
            <p><strong>Email   :</strong> <span id="infoEmail">-</span></p>
        </div>
    </div>
    
    <div id="lembar-soal"></div>
    <button onclick="sebelumSubmit()">Kumpulkan Jawaban</button>

    <div id="popupModal" class="modal">
        <div class="modal-content">
            <h3>Selamat, Jawaban Anda Telah Direkam!</h3>
            <p>Terima kasih telah menyelesaikan ujian.</p>
            <button onclick="keluarKeLogin()" style="margin-top: 20px; margin-bottom: 0;">Kembali ke Halaman Utama / Scan Barcode</button>
        </div>
    </div>

    <div id="customAlertModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="customAlertTitle" style="color: #3b82f6;">Informasi</h3>
            <p id="customAlertMessage">-</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button id="customAlertBtnCancel" onclick="tutupCustomAlert(false)" style="background: #ef4444; width: 48%; margin: 0; display: none;">Batal</button>
                <button id="customAlertBtnOk" onclick="tutupCustomAlert(true)" style="background: #007bff; width: 48%; margin: 0;">OK</button>
            </div>
        </div>
    </div>

    <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbym_6liYh9AXBoHuDr_kuvuJzyxb1JNfYQezHGTlUOQVmJxU23qzkhVLOt7o3WCT1tM/exec"; 

    // MENGGANTI ALERT DAN CONFIRM AGAR AMAN DAN TIDAK DIBLOKIR APLIKASI
    window.alert = function(message) {
        document.getElementById('customAlertTitle').innerText = 'Informasi';
        document.getElementById('customAlertMessage').innerText = message;
        document.getElementById('customAlertBtnCancel').style.display = 'none';
        document.getElementById('customAlertBtnOk').innerText = 'OK';
        document.getElementById('customAlertBtnOk').onclick = function() {
            tutupCustomAlert(true);
        };
        document.getElementById('customAlertModal').style.display = 'flex';
    };

    window.confirm = function(message) {
        document.getElementById('customAlertTitle').innerText = 'Konfirmasi';
        document.getElementById('customAlertMessage').innerText = message;
        document.getElementById('customAlertBtnCancel').style.display = 'inline-block';
        document.getElementById('customAlertBtnOk').innerText = 'Ya';
        document.getElementById('customAlertBtnOk').onclick = function() {
            tutupCustomAlert(true);
            selesaiUjian();
        };
        document.getElementById('customAlertBtnCancel').onclick = function() {
            tutupCustomAlert(false);
        };
        document.getElementById('customAlertModal').style.display = 'flex';
        return false;
    };

    function tutupCustomAlert(ok) {
        document.getElementById('customAlertModal').style.display = 'none';
    }

    let kelasSiswa = sessionStorage.getItem('cbt_kelas');
    let mapelUjian = sessionStorage.getItem('cbt_mapel');
    let namaSiswa = sessionStorage.getItem('cbt_siswa') || "Siswa Contoh";
    let emailSiswa = sessionStorage.getItem('cbt_email') || "Tidak ada email";

    document.getElementById('infoEmail').innerText = emailSiswa;
    
    let bankSoalData = null; 

    // Jika dibuka langsung tanpa melalui login CBT, defaultkan ke MTK
    if (!kelasSiswa || !mapelUjian) {
        kelasSiswa = "9 Al-Quran";
        mapelUjian = "MTK";
    }

    if (!sessionStorage.getItem('exam_start_time')) {
        sessionStorage.setItem('exam_start_time', Date.now());
    }

    const tingkatKelas = kelasSiswa.charAt(0); 
    const namaFile = `soal_${tingkatKelas}_${mapelUjian}.json`; 
    const urlBaseGitHub = "https://raw.githubusercontent.com/aktechmaster/RUANG-UJIAN-SMP-IT-NEW/refs/heads/main/";
    const urlAsli = urlBaseGitHub + namaFile;
    const urlJSON = urlAsli + "?t=" + new Date().getTime();

    // Timer (2 Jam = 7200 detik)
    let totalWaktu = 7200; 
    if (!sessionStorage.getItem('exam_time_left')) {
        sessionStorage.setItem('exam_time_left', totalWaktu);
    }

    let timeLeft = parseInt(sessionStorage.getItem('exam_time_left'));

    const timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("Waktu habis! Ujian akan dikumpulkan.");
            selesaiUjian();
        } else {
            timeLeft--;
            sessionStorage.setItem('exam_time_left', timeLeft);
            let hours = Math.floor(timeLeft / 3600);
            let minutes = Math.floor((timeLeft % 3600) / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer-display').innerText = 
                (hours < 10 ? "0" : "") + hours + ":" +
                (minutes < 10 ? "0" : "") + minutes + ":" +
                (seconds < 10 ? "0" : "") + seconds;
        }
    }, 1000);

    fetch(urlJSON)
    .then(response => {
        if (!response.ok) throw new Error("Gagal mengambil data");
        return response.json();
    })
    .then(data => {
        bankSoalData = data;

        document.getElementById('judulMapel').innerText = "Ujian Sekolah Berstandar Nasional " + (data.metadata ? data.metadata.mata_pelajaran : mapelUjian);
        document.getElementById('infoNama').innerText = namaSiswa;
        document.getElementById('infoKelas').innerText = kelasSiswa;
        
        let htmlSoal = "";
        data.bank_soal.forEach((soal, index) => {
    htmlSoal += `<div class="soal-box">`;
    
    let bagianTeks = soal.teks_pertanyaan.split('\n\n');
    let teksPertanyaanBersih = "";

    if (bagianTeks.length > 1) {
        let bacaan = bagianTeks[0];
        bacaan = bacaan.replace(/ • /g, "\n• "); 
        bacaan = bacaan.replace(/ (\d+\.) /g, "\n$1 "); 
        bacaan = bacaan.replace(/Materials:/g, "\nMaterials:\n");
        bacaan = bacaan.replace(/Steps:/g, "\nSteps:\n");

        // ✅ Cek otomatis: berisi huruf Arab atau tidak
        const adaArabBacaan = /[\u0600-\u06FF]/.test(bacaan);
        const kelasBacaan = adaArabBacaan ? "teks-arab font-khusus-arab" : "";

        htmlSoal += `<div class="bacaan ${kelasBacaan}">${bacaan.trim()}</div>`;
        teksPertanyaanBersih = bagianTeks[1];
    } else {
        teksPertanyaanBersih = soal.teks_pertanyaan;
    }

    teksPertanyaanBersih = teksPertanyaanBersih.replace(/^\d+\.\s*/, '');

    // ✅ Cek otomatis pada pertanyaan
    const adaArabPertanyaan = /[\u0600-\u06FF]/.test(teksPertanyaanBersih);
    const kelasPertanyaan = adaArabPertanyaan ? "teks-arab font-khusus-arab" : "";

    htmlSoal += `
        <div class="pertanyaan">
            <span style="font-weight:bold;">${index + 1}.</span>
            <span class="${kelasPertanyaan}">${teksPertanyaanBersih}</span>
        </div>`;
    
    htmlSoal += `<div class="opsi-container">`;
    
    soal.pilihan_jawaban.forEach((opsi, i) => {
        let nilaiOpsi = String.fromCharCode(65 + i);
        
        // ✅ Cek otomatis pada setiap opsi jawaban
        const adaArabOpsi = /[\u0600-\u06FF]/.test(opsi);
        const kelasOpsi = adaArabOpsi ? "teks-arab font-khusus-arab" : "";

        htmlSoal += `
            <div class="opsi">
                <label>
                    <input type="radio" name="soal_${soal.id_soal}" value="${nilaiOpsi}"> 
                    <span class="${kelasOpsi}">${opsi}</span>
                </label>
            </div>`;
    });
    htmlSoal += `</div></div>`;
});

        document.getElementById('lembar-soal').innerHTML = htmlSoal;

        // Merender ulang MathJax jika soal telah dimuat ke DOM
        setTimeout(() => {
            if (typeof MathJax !== 'undefined' && typeof MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise();
            }
        }, 1000);

        // Simpan jawaban siswa pada sesi
        document.querySelectorAll('input[type="radio"]').forEach(input => {
            let savedValue = sessionStorage.getItem(input.name);
            if (savedValue && input.value === savedValue) {
                input.checked = true;
            }

            input.addEventListener('change', function() {
                sessionStorage.setItem(this.name, this.value);
            });
        });
    })
    .catch(error => {
        document.getElementById('lembar-soal').innerHTML = "<p style='color:red;'><b>Gagal memuat soal! Pastikan file '" + namaFile + "' sudah ada di GitHub Anda.</b></p>";
        console.error("Error:", error);
    });

    function sebelumSubmit() {
        let belumTerjawab = [];
        
        bankSoalData.bank_soal.forEach((soal, index) => {
            let opsiDipilih = document.querySelector(`input[name="soal_${soal.id_soal}"]:checked`);
            if (!opsiDipilih) {
                belumTerjawab.push(index + 1);
            }
        });

        if (belumTerjawab.length > 0) {
            alert("Ada soal yang belum terjawab! Silakan periksa nomor: " + belumTerjawab.join(', '));
            return;
        }

        let konfirmasi = confirm("Apakah Anda yakin ingin mengumpulkan jawaban?");
        if (konfirmasi) {
            selesaiUjian();
        }
    }

    function selesaiUjian() {
        if (!bankSoalData) return;

        let totalSoal = bankSoalData.bank_soal.length;
        let jumlahBenar = 0;
        let jumlahSalah = 0;

        bankSoalData.bank_soal.forEach((soal, index) => {
            let opsiDipilih = document.querySelector(`input[name="soal_${soal.id_soal}"]:checked`);
            let kunciJawaban = bankSoalData.kunci_jawaban_rahasia ? bankSoalData.kunci_jawaban_rahasia[soal.id_soal] : undefined;

            if (opsiDipilih) {
                let jawabanSiswa = opsiDipilih.value;
                if (String(jawabanSiswa).toUpperCase() === String(kunciJawaban).toUpperCase()) {
                    jumlahBenar++;
                } else {
                    jumlahSalah++;
                }
            } else {
                jumlahSalah++;
            }
        });

        let skorAkhir = ((jumlahBenar / totalSoal) * 100).toFixed(2);

        document.getElementById('popupModal').style.display = 'flex';

        let rekapJawaban = kumpulkanJawaban();
        simpanKeSpreadsheet(namaSiswa, kelasSiswa, mapelUjian, skorAkhir, jumlahBenar, jumlahSalah, rekapJawaban);
    }

    function kumpulkanJawaban() {
        let jawaban = [];
        const daftarSoal = document.querySelectorAll('.soal-box'); 
        
        daftarSoal.forEach((soal) => {
            const inputDipilih = soal.querySelector('input[type="radio"]:checked');
            if (inputDipilih) {
                jawaban.push(inputDipilih.value); 
            } else {
                jawaban.push("-"); 
            }
        });
        
        return jawaban;
    }

    function simpanKeSpreadsheet(nama, kelas, mapel, skor, benar, salah, arrayJawaban) {
        let email = sessionStorage.getItem('cbt_email') || "-"; 
        let startTime = parseInt(sessionStorage.getItem('exam_start_time')) || Date.now();
        
        let durasiMs = Date.now() - startTime;
        let durasiMenit = Math.round(durasiMs / 60000);
        let durasiFinal = durasiMenit <= 0 ? 1 : durasiMenit;

        let dataSiswa = {
            nama: nama,
            kelas: kelas,
            mapel: mapel,
            skor: skor,
            benar: benar,
            salah: salah,
            waktu: durasiFinal + " Menit",
            email: email,
            jawaban: arrayJawaban
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataSiswa)
        }).then(() => {
            console.log("Data dan rekap jawaban berhasil dikirim.");
        }).catch(err => {
            console.error("Gagal mengirim data", err);
        });
    }

    function tutupModal() {
        document.getElementById('popupModal').style.display = 'none';
    }

    function keluarKeLogin() {
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
    </script>
</body>
</html>
