<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian CBT</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .soal-box { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .opsi { margin-bottom: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1 id="judul-mapel">Memuat Soal...</h1>
    <hr>
    
    <div id="lembar-soal"></div>
    <button onclick="selesaiUjian()">Kumpulkan Jawaban</button>

    <script>
        // MASUKKAN LINK RAW JSON ANDA DI BAWAH INI
        const urlJSON = "https://raw.githubusercontent.com/aktechmaster/RUANG-UJIAN-SMP-IT-NEW/refs/heads/main/inggris-usbn.json";

        // FUNGSI BARU: Untuk membersihkan teks dari atau 
        function bersihkanTeks(teks) {
            // Ini namanya Regex (Regular Expression), senjata andalan programmer untuk mencari pola teks
            return teks.replace(/\/g, '').replace(/\/g, '').trim();
        }

        fetch(urlJSON)
            .then(response => response.json())
            .then(data => {
                document.getElementById('judul-mapel').innerText = "Ujian: " + data.metadata.mata_pelajaran;
                
                let htmlSoal = "";
                data.bank_soal.forEach((soal, index) => {
                    htmlSoal += `<div class="soal-box">`;
                    
                    // Terapkan pembersih pada teks pertanyaan
                    let pertanyaanBersih = bersihkanTeks(soal.teks_pertanyaan);
                    htmlSoal += `<h3>${index + 1}. ${pertanyaanBersih}</h3>`;
                    
                    soal.pilihan_jawaban.forEach((opsi, i) => {
                        // Terapkan pembersih pada pilihan jawaban
                        let opsiBersih = bersihkanTeks(opsi);
                        htmlSoal += `
                            <div class="opsi">
                                <label>
                                    <input type="radio" name="soal_${soal.id_soal}" value="${opsiBersih.charAt(0)}"> 
                                    ${opsiBersih}
                                </label>
                            </div>`;
                    });
                    htmlSoal += `</div>`;
                });
                document.getElementById('lembar-soal').innerHTML = htmlSoal;
            })
            .catch(error => {
                document.getElementById('lembar-soal').innerHTML = "<p>Gagal memuat soal. Periksa koneksi internet.</p>";
            });

        function selesaiUjian() {
            alert("Jawaban disimpan! (Fitur penilaian akan dikembangkan selanjutnya)");
        }
    </script>
</body>
</html>
