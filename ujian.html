<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Ujian CBT</title>
    <style>
        /* Reset Dasar dan Mobile Friendly */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px; 
            max-width: 800px; 
            margin: auto; 
            /* Latar belakang kuning lembut dan pola garis diagonal ala WhatsApp */
            background-color: #e8ec93;
            background-image: linear-gradient(
                135deg, 
                rgba(124, 128, 58, 0.08) 25%, 
                transparent 25%, 
                transparent 50%, 
                rgba(124, 128, 58, 0.08) 50%, 
                rgba(124, 128, 58, 0.08) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 40px 40px;
            color: #333;
            font-size: 16px; /* Ukuran pas untuk HP */
            line-height: 1.6;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; }
        hr { border: 0; border-top: 2px solid #ddd; margin-bottom: 20px; }

        /* Kotak Soal Keseluruhan */
        .soal-box { 
            background: #fff; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }

        /* 2. KOTAK BACAAN / INSTRUKSI (Terpisah dari soal) */
        .bacaan {
            background: #fdfae3; /* Warna krem lembut */
            padding: 15px;
            border-left: 4px solid #f1c40f; /* Garis kuning di kiri */
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 15px;
            white-space: pre-wrap; /* Mempertahankan baris baru / enter */
        }

        /* 3. PERTANYAAN (Tidak tebal) */
        .pertanyaan {
            font-weight: normal; /* Tulisan tidak tebal */
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            gap: 8px; /* Jarak antara nomor dan teks soal */
        }

        /* 1. PILIHAN JAWABAN (Rata kiri seperti auto-numbering) */
        .opsi-container {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Jarak antar pilihan A, B, C, D */
        }
        .opsi label {
            display: flex;
            align-items: flex-start; /* Membuat bulatan radio selalu di atas sejajar dengan teks pertama */
            gap: 10px;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #eee; /* Garis bingkai tipis untuk tiap opsi */
            transition: background 0.2s;
        }
        .opsi label:hover { background: #f8f9fa; }
        .opsi input[type="radio"] {
            margin-top: 4px; /* Bulatan turun sedikit agar sejajar dengan teks */
            flex-shrink: 0; /* Mencegah bulatan gepeng jika teks panjang */
            width: 18px;
            height: 18px;
        }

        /* Tombol Kumpulkan */
        button { 
            width: 100%; /* Tombol melebar penuh di layar HP */
            padding: 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            margin-bottom: 30px;
        }
        button:hover { background: #0056b3; }

        .header-ujian {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #38bdf8;
        }
        .header-ujian h2 {
            margin-bottom: 10px;
            color: #1e293b;
        }
        .info-siswa p {
            margin: 5px 0;
            font-size: 0.95rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="header-ujian">
        <h2 id="judulMapel">Memuat Mata Pelajaran...</h2>
        <div class="info-siswa">
            <p><strong>Nama:</strong> <span id="infoNama">-</span></p>
            <p><strong>Kelas:</strong> <span id="infoKelas">-</span></p>
        </div>
    </div>
    
    <div id="lembar-soal"></div>
    <button onclick="selesaiUjian()">Kumpulkan Jawaban</button>

    <script>
        // 1. Ambil data siswa yang sudah login
        let kelasSiswa = sessionStorage.getItem('cbt_kelas');
        let mapelUjian = sessionStorage.getItem('cbt_mapel');

        // Proteksi jika diakses langsung tanpa login (agar tidak error)
        if (!kelasSiswa || !mapelUjian) {
            kelasSiswa = "9 Al-Quran";
            mapelUjian = "ING";
        }

        // 2. Ambil angka kelas depannya saja (misal ambil "9")
        const tingkatKelas = kelasSiswa.charAt(0); 

        // 3. Rakit nama file JSON-nya
        const namaFile = `soal_${tingkatKelas}_${mapelUjian}.json`; 

        // 4. Gabungkan URL utama GitHub Anda dengan nama file yang baru dirakit
        const urlBaseGitHub = "https://raw.githubusercontent.com/aktechmaster/RUANG-UJIAN-SMP-IT-NEW/refs/heads/main/";
        const urlAsli = urlBaseGitHub + namaFile;

        // 5. Trik Cache-Buster 
        const urlJSON = urlAsli + "?t=" + new Date().getTime();

        fetch(urlJSON)
            .then(response => {
                if (!response.ok) throw new Error("Gagal mengambil data");
                return response.json();
            })
            .then(data => {
                // Memperbaiki ID: Menggunakan judulMapel sesuai elemen HTML
                document.getElementById('judulMapel').innerText = "Ujian: " + (data.metadata ? data.metadata.mata_pelajaran : mapelUjian);
                
                // Menampilkan nama & kelas di header
                document.getElementById('infoNama').innerText = sessionStorage.getItem('cbt_siswa') || "Nama Siswa Contoh";
                document.getElementById('infoKelas').innerText = kelasSiswa;
                
                let htmlSoal = "";
                data.bank_soal.forEach((soal, index) => {
                    htmlSoal += `<div class="soal-box">`;
                    
                    // MEMISAHKAN BACAAN DAN SOAL BERDASARKAN \n\n
                    let bagianTeks = soal.teks_pertanyaan.split('\n\n');
                    let teksPertanyaanBersih = "";

                    if (bagianTeks.length > 1) {
                        let bacaan = bagianTeks[0];
                        
                        bacaan = bacaan.replace(/ • /g, "\n• "); 
                        bacaan = bacaan.replace(/ (\d+\.) /g, "\n$1 "); 
                        bacaan = bacaan.replace(/Materials:/g, "\nMaterials:\n");
                        bacaan = bacaan.replace(/Steps:/g, "\nSteps:\n");

                        htmlSoal += `<div class="bacaan">${bacaan.trim()}</div>`;
                        teksPertanyaanBersih = bagianTeks[1];
                    } else {
                        teksPertanyaanBersih = soal.teks_pertanyaan;
                    }

                    teksPertanyaanBersih = teksPertanyaanBersih.replace(/^\d+\.\s*/, '');

                    htmlSoal += `
                        <div class="pertanyaan">
                            <span>${index + 1}.</span>
                            <span>${teksPertanyaanBersih}</span>
                        </div>`;
                    
                    htmlSoal += `<div class="opsi-container">`;
                    soal.pilihan_jawaban.forEach((opsi, i) => {
                        htmlSoal += `
                            <div class="opsi">
                                <label>
                                    <input type="radio" name="soal_${soal.id_soal}" value="${opsi.charAt(0)}"> 
                                    <span>${opsi}</span>
                                </label>
                            </div>`;
                    });
                    htmlSoal += `</div></div>`;
                });
                document.getElementById('lembar-soal').innerHTML = htmlSoal;
            })
            .catch(error => {
                document.getElementById('lembar-soal').innerHTML = "<p style='color:red;'><b>Gagal memuat soal! Pastikan file '" + namaFile + "' sudah ada di GitHub Anda.</b></p>";
                console.error("Error:", error);
            });

        function selesaiUjian() {
            alert("Jawaban disimpan!");
        }
    </script>
</body>
</html>
